name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5
      - name: Verify tag, tests, and deployment renders
        run: |
          source_version="$(go run . version)"
          source_version="${source_version#venator }"
          if [ "$GITHUB_REF_NAME" != "v${source_version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match source version $source_version" >&2
            exit 1
          fi
          go test -count=1 ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          helm lint config --strict
          cp -R config /tmp/venator-chart
          sed -i 's/enabled: false/enabled: true/' \
            /tmp/venator-chart/rules/example/single-stage-alert.yaml
          sed -i '/^queryEngine:/i exclusionsPath: /app/exclusion/example-rule.yaml' \
            /tmp/venator-chart/rules/example/single-stage-alert.yaml
          helm template venator /tmp/venator-chart --namespace venator \
            --kube-version 1.27.0 \
            >/tmp/venator.yaml
          grep -q '^kind: CronJob$' /tmp/venator.yaml
          grep -q 'name: "example-rule-exclusion"' /tmp/venator.yaml
          helm template venator /tmp/venator-chart --namespace venator \
            --kube-version 1.27.0 \
            -f /tmp/venator-chart/examples/clickhouse-mtls-values.yaml \
            >/tmp/venator-mtls.yaml
          grep -q 'mountPath: /var/run/secrets/venator/clickhouse' \
            /tmp/venator-mtls.yaml
          kubectl kustomize deploy/kubernetes >/tmp/venator-kustomize.yaml

  binaries:
    needs: verify
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum
      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/venator-${GOOS}-${GOARCH}" .
      - uses: actions/upload-artifact@v7
        with:
          name: venator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: venator-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          helm package config --destination dist
          cd dist
          sha256sum venator-linux-* venator-darwin-* venator-*.tgz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image version
        id: version
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/0x4d31/venator:${{ github.ref_name }}
            ghcr.io/0x4d31/venator:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
