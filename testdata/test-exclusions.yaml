- name: known test user from internal IP
  when: |
    "username" in event &&
    "ip_address" in event &&
    event.username == "test" &&
    event.ip_address == "192.168.1.1"

- name: expected internal domain
  when: |
    ("email" in event && event.email.contains("@example.com")) ||
    ("domain" in event && event.domain == "internal.local")

- name: expected fast response
  when: |
    "response_time" in event && event.response_time == "fast"

- name: privileged role
  when: |
    "user_role" in event && event.user_role in ["admin", "superuser"]

- name: example.com URL
  when: |
    "url" in event &&
    event.url.matches("^https?://(?:[a-z0-9]+\\.)*example\\.com/.*$")

- name: expected department
  when: |
    "department" in event && event.department in ["sales", "hr"]

- name: inactive status
  when: |
    "status" in event && event.status != null && event.status != "active"

- name: unexpected region
  when: |
    "region" in event &&
    event.region != null &&
    !(event.region in ["us-east-1", "us-west-2"])
