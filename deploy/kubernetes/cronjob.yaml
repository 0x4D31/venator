apiVersion: batch/v1
kind: CronJob
metadata:
  name: venator-example
  namespace: venator
  labels:
    app.kubernetes.io/name: venator
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.2.0"
spec:
  schedule: "5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: venator
            app.kubernetes.io/instance: example
        spec:
          automountServiceAccountToken: false
          serviceAccountName: venator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: venator
              image: ghcr.io/0x4d31/venator:v0.2.0
              imagePullPolicy: IfNotPresent
              args:
                - run
                - --global-config
                - /etc/venator/global/global.yaml
                - --rule-config
                - /etc/venator/rule/rule.yaml
              envFrom:
                - secretRef:
                    name: venator-secrets
                    optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: global-config
                  mountPath: /etc/venator/global
                  readOnly: true
                - name: rule-config
                  mountPath: /etc/venator/rule
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: global-config
              configMap:
                name: venator-global-config
            - name: rule-config
              configMap:
                name: venator-rule
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
