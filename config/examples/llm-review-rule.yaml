name: local-llm-review
uid: 971e4c6f-f7b8-42a6-a2ce-c592ad5f1fd4
status: example
confidence: low
enabled: true
queryEngine: file.ndjson
publishers: [stdout.default]
language: NDJSON
query: ./events.ndjson
expr: event.severity >= 5
output:
  format: raw
description: Detect and review high-severity events in the bundled snapshot.
tags: [example, local, llm]
author: "0x4D31"
llm:
  enabled: true
  required: false
  maxFindings: 25
  evidenceFields: [timestamp, host, user, kind, severity]
  redactFields: [user]
  prompt: Assess whether each supplied security finding deserves analyst attention based only on the supplied evidence.
