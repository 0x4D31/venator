{{- $ruleNames := dict }}
{{- range $path, $_ := .Files.Glob "rules/**.yaml" }}
{{- $cfg := $.Files.Get $path | fromYaml }}
{{- if or (not (kindIs "string" $cfg.name)) (gt (len $cfg.name) 52) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $cfg.name)) }}
{{- fail (printf "rule in %s has name %q; Helm rule names must be DNS-1123 labels of at most 52 characters" $path $cfg.name) }}
{{- end }}
{{- if eq $cfg.name "global" }}
{{- fail (printf "rule in %s uses reserved name %q because its ConfigMap would collide with global-config" $path $cfg.name) }}
{{- end }}
{{- if hasKey $ruleNames $cfg.name }}
{{- fail (printf "rules %s and %s use duplicate name %q" (get $ruleNames $cfg.name) $path $cfg.name) }}
{{- end }}
{{- $_ := set $ruleNames $cfg.name $path }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" $cfg.name | quote }}
  labels:
    app.kubernetes.io/name: venator
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    venator.io/rule: {{ $cfg.name | quote }}
data:
  {{ printf "%s.yaml" $cfg.name | quote }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
