container:
  name: venator
  image: ghcr.io/0x4d31/venator:v0.2.0
  imagePullPolicy: IfNotPresent

imagePullSecrets: []

# Retained for compatibility with v0.1 values files. Venator runs CronJobs and
# therefore does not use a Deployment replica count or name overrides.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""

cronJob:
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  # null preserves completed Jobs for the CronJob history limits and GKE UI.
  ttlSecondsAfterFinished: null
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Backward-compatible default. The reference is optional so rules that do not
# use OpenSearch start without a Secret. Override or empty this list as needed.
secretEnv:
  - name: OPENSEARCH_PASSWORD
    secretName: ""
    key: OSPASSWORD
    optional: true

# Add credentials only to named rules. Set secretEnv: [] when using this for
# complete per-rule isolation.
ruleSecretEnv: {}

# Existing Secrets can expose connector-specific variables without chart edits.
envFrom: []
ruleEnvFrom: {}

extraEnv: []

# Mount CA bundles, mTLS client certificates, or other connector-owned files.
# Use the per-rule maps to keep credentials out of unrelated CronJobs.
extraVolumes: []
extraVolumeMounts: []
ruleExtraVolumes: {}
ruleExtraVolumeMounts: {}

podAnnotations: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Optional per-rule KSA overrides, keyed by rule name.
ruleServiceAccounts: {}
