# A runnable local example: bounded NDJSON events on stdin are selected with
# CEL and become canonical Venator findings on stdout.
name: local-ndjson-alert
uid: 6722b4ed-f891-4906-a4b2-f57762dfc72b
status: stable
confidence: high
enabled: false
schedule: "5 * * * *"
queryEngine: stdin.default
publishers:
  - stdout.default
language: NDJSON
expr: has(event.severity) && event.severity >= 5
output:
  format: raw
description: Detect high-severity events from a bounded local NDJSON producer.
references:
  - https://github.com/0x4D31/venator
tags:
  - local
  - ndjson
author: "0x4D31"
